[project]
name = "anish-codingenv"
version = "0.1.0"
description = "Hackable coding environment with independent correctness checks and Docker execution"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
