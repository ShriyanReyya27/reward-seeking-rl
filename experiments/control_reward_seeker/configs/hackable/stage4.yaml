model_name: "openai/gpt-oss-120b"
lora_rank: 32
renderer_name: "gpt_oss_medium_reasoning"
env: "verl"
verl_reward_path: "${RSRL_CONTROL_DIR}/reward_control.py"
verl_reward_function_name: "compute_score"
verl_max_turns: 30
group_size: 16
groups_per_batch: 48
max_tokens: 6000
max_trajectory_tokens: 8000
temperature: 1.0
kl_penalty_coef: 0.0
loss_fn: "importance_sampling"
num_substeps: 1
max_steps_off_policy: 8
compute_post_kl: false
n_epochs: 1000
eval_every: 0
save_every: 10
behavior_if_log_dir_exists: "resume"
learning_rate: 8e-05
verl_train_files: ["${RSRL_CONTROL_DIR}/data/curriculum/hackable/stage4.parquet"]
verl_test_files: ["${RSRL_CONTROL_DIR}/data/curriculum/hackable/stage4.parquet"]
log_path: "${RSRL_CONTROL_DIR}/runs/hackable"
wandb_project: "rsrl-oss430-control"
wandb_name: "hackable-s4-number_guessing_fake_secret"
