   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #22221f" x="7.2" y="23.523898" transform="rotate(-0 7.2 23.523898)">Task 1: earlier scores shown in the prompt</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b6a64" x="7.2" y="46.295802" transform="rotate(-0 7.2 46.295802)">The evidence about the rule is in the prompt. The rule changes every episode, so it can't be stored in the weights.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b6a64" x="17.61244" y="89.139852" transform="rotate(-0 17.61244 89.139852)">What the model sees</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: start; fill: #22221f" x="19.694928" y="112.724673" transform="rotate(-0 19.694928 112.724673)">Give an integer from 120 to 160 that is even.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: start; fill: #22221f" x="19.694928" y="133.539611" transform="rotate(-0 19.694928 133.539611)">&lt;answer&gt;158&lt;/answer&gt;</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: start; fill: #22221f" x="19.694928" y="153.330799" transform="rotate(-0 19.694928 153.330799)">Score for your last answer: 1.0</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: start; fill: #22221f" x="19.694928" y="176.699761" transform="rotate(-0 19.694928 176.699761)">Give an integer from 30 to 75 that is odd.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: start; fill: #22221f" x="19.694928" y="197.514699" transform="rotate(-0 19.694928 197.514699)">&lt;answer&gt;33&lt;/answer&gt;</text>
