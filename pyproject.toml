[project]
name = "rsrl"
version = "0.1.0"
description = "Does reward seeking generalise to new RL environments better than instruction following?"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Per-environment extras go here so one env's deps never break another's.
# e.g. healthbench = ["datasets", "openai"]
healthbench = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
